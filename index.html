<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
    <title>Mundo Animal</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>

    <!-- card header / titulo -->
    <div class="container-fluid p-0">
        <div class="card w-full bg-danger border border-dark border-1 rounded-0 text-light text-centermy-0">
            
            <div class="card-body d-flex justify-content-between align-items-center position-relative">

                <!-- titulo e subtitulo -->
                <div class="text-center w-100">
                    <a href="/" class="text-decoration-none text-light">
                    <h1 class="card-title">Mundo Animal</h1>
                    <p class="card-text mb-0">O melhor lugar para cuidar do seu pet!</p>
                    </a>
                </div>
                <!------------------------->


                <!--logo mundo animal-->
                <div id="logo" class="position-absolute top-50 start-0 translate-middle-y px-5">
                    <img src="assets/logo.webp" alt="Logo Mundo Animal" class="img-fluid" style="max-height: 80px;">
                </div>


                <div id="campoPesquisa" class="position-absolute top-50 translate-middle" style="left: 75%">
                    <form class="d-flex" role="search" aria-label="Campo de pesquisa">
                        <input class="form-control me-2 rounded-pill" type="search" placeholder="Pesquisar..." aria-label="Pesquisar" style="width: 400px;">
                        <!-- <button class="btn btn-outline-light" type="submit">Pesquisar</button> -->
                    </form>
                </div>

                <!--icones redes-->
                <div class="position-absolute top-50 end-0 translate-middle-y pe-3">
                    <p class="mb-0 text-right">Siga nossas redes sociais:</p>
                    
                    <div class="d-flex gap-3 justify-content align-items ">

                        <!-- icone whatsapp -->
                        <a href="https://wa.me/SEUNUMERO"
                        class="text-light"
                        target="_blank"
                        aria-label="WhatsApp">
                            <i class="bi bi-whatsapp fs-3"></i>
                        </a>

                        <!-- icone instagram -->
                        <a href="https://instagram.com/SEUUSUARIO"
                        class="text-light"
                        target="_blank"
                        aria-label="Instagram">
                            <i class="bi bi-instagram fs-3"></i>
                        </a>

                        <!-- icone facebook -->
                        <a href="https://facebook.com/SEUPERFIL"
                        class="text-light"
                        target="_blank"
                        aria-label="Facebook">
                            <i class="bi bi-facebook fs-3"></i>
                        </a>

                        <!-- icone tiktok -->
                        <a href="https://tiktok.com/@SEUUSUARIO"
                        class="text-light"
                        target="_blank"
                        aria-label="TikTok">
                            <i class="bi bi-tiktok fs-3"></i>
                        </a>

                    </div>
                </div>
                <!------------------------->

            </div>
        </div>
    </div>
    <!--fim card header-->

    <!-- menu de navegacao -->
    <nav class="navbar navbar-light bg-light border-end border-bottom border-dark" aria-label="Navegacao principal">
        <div class="container-fluid flex-column">
            <button class="navbar-toggler mx-auto border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Expandir ou ocultar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse w-100" id="menuPrincipal">
                <ul class="navbar-nav flex-column align-items-stretch gap-2">
                    <li class="nav-item">
                        <button class="nav-link btn-custom-1 text-dark px-3 bg-transparent border-0 rounded-pill" onclick="window.location.href='#cliente'">Cliente</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn-custom-1 text-dark px-3 bg-transparent border-0 rounded-pill" onclick="window.location.href='#funcionario'">Funcionário</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn-custom-1 text-dark px-3 bg-transparent border-0 rounded-pill" onclick="window.location.href='#atendimento'">Atendimento</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn-custom-1 text-dark px-3 bg-transparent border-0 rounded-pill" onclick="window.location.href='#relatorios'">Relatórios</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link btn-custom-1 text-dark px-3 bg-transparent border-0 rounded-pill" onclick="window.location.href='#pagina-institucional'">Página Institucional</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

 

</body>
</html>
