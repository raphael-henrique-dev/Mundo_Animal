    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>

    <script>
        function mudarFoto() {
            const imagemHero = document.querySelector('.hero-section img');
            imagemHero.src = randomImage();
        }

        function randomImage() {
            const imagens = [
                'assets/hero1.jpeg',
                'assets/hero2.jpeg',
                'assets/hero3.jpeg'
            ];
            const indiceAleatorio = Math.floor(Math.random() * imagens.length);
            return imagens[indiceAleatorio];
        }

    </script>

    <!-- card header / titulo -->
    <div class="container-fluid p-0">
        <div class="card w-full bg-danger border border-dark border-1 rounded-0 text-light text-centermy-0">
            
            <div class="card-body d-flex justfify-content-between align-items-center">

                <!-- titulo e subtitulo -->
                <div class="text-center w-100">
                    <h1 class="card-title">Mundo Animal</h1>
                    <p class="card-text mb-0">O melhor lugar para cuidar do seu pet!</p>
                </div>
                <!------------------------->


                <!--icones redes-->
                <div class="ms-auto">
                    <p class="mb-0 text-right">Siga nossas redes sociais:</p>
                    
                    <div class="d-flex gap-3 justify-content align-items ">

                        <!-- icone whatsapp -->
                        <a href="https://wa.me/SEUNUMERO"
                        class="text-light"
                        target="_blank"
                        aria-label="WhatsApp">
                            <i class="bi bi-whatsapp fs-3"></i>
                        </a>

                        <!-- icone instagram -->
                        <a href="https://instagram.com/SEUUSUARIO"
                        class="text-light"
                        target="_blank"
                        aria-label="Instagram">
                            <i class="bi bi-instagram fs-3"></i>
                        </a>

                        <!-- icone facebook -->
                        <a href="https://facebook.com/SEUPERFIL"
                        class="text-light"
                        target="_blank"
                        aria-label="Facebook">
                            <i class="bi bi-facebook fs-3"></i>
                        </a>

                    </div>
                </div>
                <!------------------------->

            </div>
        </div>
    </div>
    <!--fim card header-->

    <!-- menu de navegacao -->
    <nav class="navbar navbar-expand bg-light border-bottom border-dark" aria-label="Navegacao principal">
        <div class="container-fluid justify-content-center">
            <ul class="navbar-nav flex-row flex-wrap justify-content-center gap-2">
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" href="#inicio">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" href="#servicos">Servicos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" href="#sobre">Sobre nos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark px-3" href="#contato">Contato</a>
                </li>
            </ul>
        </div>
    </nav>

    <!--section / hero-->

<div id="carrosel" class="carousel slide">

  <div class="carousel-inner w-100 h-50">

    <div class="carousel-item active">
      <img src="assets/hero1.jpeg" class="d-block w-100 carousel-img" alt="...">
    </div>
    <div class="carousel-item">
      <img src="assets/hero2.jpeg" class="d-block w-100 carousel-img" alt="...">
    </div>
    <div class="carousel-item">
      <img src="assets/hero3.jpeg" class="d-block w-100 carousel-img" alt="...">
    </div>

  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#carrosel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#carrosel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>

</div>
