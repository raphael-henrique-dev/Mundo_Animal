                <!-- titulo e subtitulo -->

                    <a href="../../index.html" class="text-decoration-none text-light">

                    </a>

                        <a href="https://wa.me/SEUNUMERO"

                        target="_blank"

                        </a>

                        <!-- icone instagram -->
                        <a href="https://instagram.com/SEUUSUARIO"
                        class="text-light"
                        target="_blank"

                        </a>

                        <!-- icone facebook -->
                        <a href="https://facebook.com/SEUPERFIL"
                        class="text-light"
                        target="_blank"

                        </a>

                        <!-- icone tiktok -->
                        <a href="https://tiktok.com/@SEUUSUARIO"
                        class="text-light"
                        target="_blank"

                    </div>
